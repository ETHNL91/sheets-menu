name: Build and Deploy

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"  # every hour, UTC
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          SHEETS_DOC_ID: ${{ secrets.SHEETS_DOC_ID }}
        run: npm run build

      - name: Encrypt index.html with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "STATICRYPT_PASSWORD is not set"; exit 1;
          fi
          npx staticrypt _site/index.html -p "$STATICRYPT_PASSWORD" --short -o _site/index.html

      - name: Debug encrypted index.html
        run: |
          echo "First 40 lines of _site/index.html:"
          head -n 40 _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
